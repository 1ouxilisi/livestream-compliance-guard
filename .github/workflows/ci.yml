name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  rules-and-evals:
    name: Rules sync · lint · baseline · pytest · wheel · evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 规则核心零第三方依赖即可验证；无需 pip install，CI 秒级完成
      - name: Rules JSON in sync with source
        run: python scripts/export_rules.py --check

      - name: Baseline behavior tests
        run: python tests/run_baseline.py

      # 单元测试需要 mcp（覆盖 server_stdio）与 pytest
      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff static checks
        run: python -m ruff check src tests scripts server.py

      - name: pytest unit tests
        run: python -m pytest -q

      # 打包守门：构建 wheel 并解包断言规则词库随包打入，防止独立安装后引擎加载空词库
      - name: Build wheel and verify rule lexicon bundled
        run: |
          python -m pip install build
          python -m build --wheel
          python - <<'PY'
          import glob, sys, zipfile
          whl = glob.glob('dist/*.whl')[0]
          names = zipfile.ZipFile(whl).namelist()
          required = [
              "lcg/rules/rules.v1.json",
              "lcg/rules/plugins/food.json",
              "lcg/rules/plugins/cosmetics.json",
          ]
          missing = [r for r in required if r not in names]
          if missing:
              print("MISSING in wheel:", missing)
              sys.exit(1)
          print("wheel OK, rule lexicon bundled:", ", ".join(required))
          PY

      - name: Eval suite (regenerate BENCHMARK)
        run: python evals/run_evals.py

      # 评测会刷新 reports/BENCHMARK.md；若有变化则提交回仓库，保持报告与代码同步
      - name: Commit refreshed BENCHMARK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/BENCHMARK.md
          git diff --staged --quiet || git commit -m "chore(benchmark): refresh BENCHMARK.md [skip ci]"
